# Schwinger production of BSM magnetic-monopole pairs, reproducing the PbPb reference samples:
# m = 100 GeV, g = 1 g_D, one pair per event, isotropic
# Three things to note in this configuration:
#  * the trailing "+" on fileName is mandatory. The macro is compiled with ACLiC because cling
#    cannot interpret it. The build products go next to the macro when that directory is
#    writable, and into $TMPDIR, or /tmp/<user> when $TMPDIR is not set, as soon as it is not
#    - the CVMFS case - so a Grid job never writes into the installation.
#  * it needs an O2 with the monopole integration (SimulationDataFormat/MonopoleParticles.h
#    and the G4.monopole* keys); it does not compile against an older one.
#  * the mass and the magnetic charge are *transport* settings: they are read in the transport
#    process, before its own generator even exists, so the generator cannot set them and they
#    have to be given here, in the [G4] section. The generator reads them back and refuses to
#    start if they disagree with the JSON.
#NEV_TEST> 20
[GeneratorExternal]
fileName = ${O2DPG_MC_CONFIG_ROOT}/MC/config/BSM/external/generator/GeneratorMonopoles.C+
funcName = GeneratorMonopoles("${O2DPG_MC_CONFIG_ROOT}/MC/config/BSM/external/generator/monopoles_schwinger_PbPb.json")

[G4]
monopole = true
monopoleMass = 100
monopoleMagneticCharge = 1
