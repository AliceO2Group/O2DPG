### The external generator derives from GeneratorPythia8.
[GeneratorExternal]
fileName=${O2DPG_MC_CONFIG_ROOT}/MC/config/PWGDQ/external/generator/generator_pythia8_HadronTriggered_withGap.C
funcName=GeneratorInclusiveAllQuarkonia_EvtGenMidY(5,-1.0,1.0,"non-prompt:0.2,443:0.5:prompt,20443:0.17:prompt,445:0.095:prompt,10441:0.014:prompt",0)
# non-prompt J/psi is enhanced through branching ratio, we decrease a bit the amount of enhancement relative to prompt J/psi
# enhances prompt psi(2S) compared to J/psi and chi_c1,2
# reduces prompt chi_c so that their feeddown to J/psi is the same as if decay chi_c to J/psi was not forced

[GeneratorPythia8]
config=${O2DPG_MC_CONFIG_ROOT}/MC/config/PWGDQ/pythia8/generator/pythia8_oniaAll_triggerGap.cfg
