# Forced Omega(2012)- -> Xi(1530)0 K- -> Xi- pi+ K- for single-channel ML signal samples (one decay channel per job).
# Used for both charges: Pythia applies the charge conjugate of the positive-PDG table to Omega(2012)+.
# Particle definition as in resonances_width.cfg (123334 is not a Pythia default particle).
# Xi and Lambda are not decayed by the generator (base.cfg: mayDecay off) but by the transport code with
# their natural branching fractions; forcing them here would have no effect.
# id::all = name antiName spinType chargeType colType m0 mWidth mMin mMax tau0
123334:all = Omega2012Minus Omega2012Minusbar 4 -3 0 2.0125 0.0064 1.8210 2.0765 0
### Omega(2012)- -> Xi(1530)0 K-
123334:oneChannel = 1 1.000 0 3324 -321
### Xi(1530)0 -> Xi- pi+
3324:oneChannel = 1 1.000 0 3312 211
