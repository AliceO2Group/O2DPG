# Forced K1(1270) -> K*(892) pi -> K pi pi for single-channel ML signal samples (one decay channel per job).
# Used for both charges: Pythia applies the charge conjugate of the positive-PDG table to K1(1270)-.
# Mass and width are the Pythia defaults of 10323; the width macro samples the line shape (mSel).
# Branching fractions are forced to unity: weight with the natural fractions in the analysis.
### K1(1270)+ -> K*(892)0 pi+
