### Lets the EventDecayer (EventDecayer.enable=true) decay the charm baryons that base.cfg keeps stable.
### Use it in a free EventDecayer.config slot next to the force_hadronic_charmbaryon*.cfg decay channels,
### e.g. DecayerPythia8.config[1]=force_hadronic_charmbaryon.cfg;EventDecayer.enable=true;EventDecayer.config[2]=eventdecayer_charmbaryon.cfg
4132:mayDecay = on     # Xi_c0
4232:mayDecay = on     # Xi_c+
4332:mayDecay = on     # Omega_c0
